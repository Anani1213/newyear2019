<!-- ==================== SPLASH GATE (runs before paint) ==================== -->
<script>
  (function () {
    try {
      if (sessionStorage.getItem('zemen_splash_shown') === '1') {
        document.documentElement.classList.add('skip-splash');
      }
    } catch (e) { /* storage disabled — fall through to splash */ }
  })();
</script>

<style>
  html, body { -webkit-tap-highlight-color: transparent; }
  body { overscroll-behavior-y: none; }

  /* Splash skip (returning within the same session) — killed before first paint */
  html.skip-splash #splash { display: none !important; }

  /* ---------- Splash animations ---------- */
  @keyframes zGlow {
    0%, 100% { transform: scale(1);    opacity: .55; }
    50%      { transform: scale(1.18); opacity: .95; }
  }
  @keyframes zBar {
    0%   { transform: translateX(-100%); }
    100% { transform: translateX(320%); }
  }
  @keyframes zPop {
    0%   { transform: scale(.6); opacity: 0; }
    60%  { transform: scale(1.08); opacity: 1; }
    100% { transform: scale(1); opacity: 1; }
  }
  @keyframes zFadeUp {
    from { opacity: 0; transform: translateY(10px); }
    to   { opacity: 1; transform: translateY(0); }
  }
  @keyframes zPulseRing {
    0%   { transform: scale(.9); opacity: .7; }
    100% { transform: scale(1.9); opacity: 0; }
  }
  @keyframes zRipple {
    0%   { transform: scale(.85); opacity: .9; }
    100% { transform: scale(2.1); opacity: 0; }
  }
  @keyframes zSpin { to { transform: rotate(360deg); } }

  .splash-logo   { animation: zPop .7s cubic-bezier(.2,.9,.3,1.4) both; }
  .splash-glow   { animation: zGlow 2.2s ease-in-out infinite; }
  .splash-bar    { animation: zBar 1.25s ease-in-out infinite; }
  .card-in       { animation: zFadeUp .45s ease both; }

  .pulse-ring::after {
    content: '';
    position: absolute; inset: 0;
    border-radius: 9999px;
    border: 2px solid rgba(16,185,129,.6);
    animation: zPulseRing 1.5s ease-out infinite;
  }
  .ripple::before {
    content: '';
    position: absolute; inset: 0;
    border-radius: 9999px;
    background: rgba(16,185,129,.35);
    animation: zRipple 1.4s ease-out infinite;
  }

  /* Hide scrollbars but keep scroll */
  .no-bar::-webkit-scrollbar { display: none; }
  .no-bar { -ms-overflow-style: none; scrollbar-width: none; }

  /* Mic button must never be selectable / callout-able */
  #micBtn { user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; }
</style>
</head>

<script>
/* ================================================================
   ZEMEN SUPER APP — Dashboard Controller
   ================================================================ */
(function () {
  'use strict';

  /* ---------------------------------------------------------------
     0. CONSTANTS
     --------------------------------------------------------------- */
  const SPLASH_KEY   = 'zemen_splash_shown';
  const WELCOME_KEY  = 'zemen_voice_welcome';
  const BALANCE_KEY  = 'zemen_wallet_balance';
  const WELCOME_TEXT = 'Welcome to Zemen Super App. Press and hold the microphone to speak.';

  const $ = (id) => document.getElementById(id);

  /* ---------------------------------------------------------------
     1. MINI-APP REGISTRY (micro-frontend hub)
     --------------------------------------------------------------- */
  const APPS = [
    { name: 'Zemen Gebeya',   href: 'gebeya.html', icon: 'fa-store',              bg: 'from-emerald-400 to-green-500'  },
    { name: 'Zemen Equb',     href: 'ekub.html',   icon: 'fa-people-group',       bg: 'from-teal-400 to-emerald-500'   },
    { name: 'Ethio P2P',      href: 'p2p.html',    icon: 'fa-right-left',         bg: 'from-green-400 to-teal-600'     },
    { name: 'Zemen Shield',   href: 'shield.html', icon: 'fa-shield-halved',      bg: 'from-lime-400 to-green-500'     },
    { name: 'Ride & Ticket',  href: 'ride.html',   icon: 'fa-car-side',           bg: 'from-cyan-400 to-teal-500'      },
    { name: 'Micro Finance',  href: 'sanduq.html', icon: 'fa-piggy-bank',         bg: 'from-emerald-500 to-green-600'  },
    { name: 'Food Delivery',  href: 'food.html',   icon: 'fa-utensils',           bg: 'from-amber-400 to-orange-500'   },
    { name: 'Donate & Charity', href: 'donate.html', icon: 'fa-hand-holding-heart', bg: 'from-rose-400 to-pink-500'    },
    { name: 'Zemen Work',     href: 'work.html',   icon: 'fa-briefcase',          bg: 'from-sky-400 to-blue-500'       }
  ];

  function renderGrid() {
    const grid = $('appGrid');
    if (!grid) return;
    grid.innerHTML = APPS.map((a, i) => `
      <a href="${a.href}"
         style="animation-delay:${i * 35}ms"
         class="card-in group flex flex-col items-center justify-start gap-2 pt-3.5 pb-3 px-1.5
                bg-white rounded-2xl border border-gray-100 shadow-sm shadow-gray-200/60
                hover:shadow-md hover:-translate-y-0.5 active:scale-95 transition-all duration-150">
        <span class="w-12 h-12 rounded-2xl bg-gradient-to-br ${a.bg}
                     flex items-center justify-center
                     shadow-md shadow-emerald-500/15">
          <i class="fa-solid ${a.icon} text-white text-[18px]"></i>
        </span>
        <span class="text-[10.5px] font-bold text-gray-700 text-center leading-[1.15] min-h-[24px]
                     flex items-center">${a.name}</span>
      </a>
    `).join('');
  }

  /* ---------------------------------------------------------------
     2. TOAST
     --------------------------------------------------------------- */
  let toastTimer = null;
  function toast(message) {
    const el = $('toast');
    if (!el) return;
    el.textContent = message;
    el.classList.remove('opacity-0', 'translate-y-2');
    el.classList.add('opacity-100', 'translate-y-0');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => {
      el.classList.add('opacity-0', 'translate-y-2');
      el.classList.remove('opacity-100', 'translate-y-0');
    }, 2200);
  }

  /* ---------------------------------------------------------------
     3. DEMO WALLET (localStorage)
     --------------------------------------------------------------- */
  let balanceHidden = false;

  function getBalance() {
    let v = parseFloat(localStorage.getItem(BALANCE_KEY));
    if (!isFinite(v) || v < 0) {
      v = 12500;
      try { localStorage.setItem(BALANCE_KEY, String(v)); } catch (e) {}
    }
    return v;
  }
  function setBalance(v) {
    try { localStorage.setItem(BALANCE_KEY, String(v)); } catch (e) {}
    renderBalance();
  }
  function renderBalance() {
    const el = $('balanceValue');
    if (!el) return;
    el.textContent = balanceHidden
      ? '••••••'
      : getBalance().toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
  }

  /* ---------------------------------------------------------------
     4. VOICE ASSISTANT
     --------------------------------------------------------------- */
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;

  let recognition   = null;
  let isListening   = false;
  let voiceBusy     = false;   // listening OR speaking → keep panel open
  let finalText     = '';
  let handled       = false;
  let panelTimer    = null;
  let welcomePending = true;

  /* ---- Intent map (en-US fuzzy keyword routing) ---- */
  const INTENTS = [
    { href: 'food.html',   label: 'Food Delivery',
      words: ['food', 'hungry', 'eat', 'meal', 'lunch', 'dinner', 'restaurant', 'pizza', 'burger', 'food delivery', 'order food'] },
    { href: 'gebeya.html', label: 'Zemen Gebeya',
      words: ['gebeya', 'market', 'marketplace', 'shop', 'shopping', 'store', 'buy', 'grocery', 'groceries', 'products'] },
    { href: 'ekub.html',   label: 'Zemen Equb',
      words: ['ekub', 'equb', 'saving circle', 'savings circle', 'circle', 'rotation', 'community saving', 'merry go round'] },
    { href: 'p2p.html',    label: 'Ethio P2P',
      words: ['p2p', 'peer to peer', 'peer', 'send money', 'transfer money', 'transfer', 'send cash', 'send to friend'] },
    { href: 'shield.html', label: 'Zemen Shield',
      words: ['shield', 'insurance', 'insure', 'protect', 'protection', 'coverage', 'policy', 'health cover'] },
    { href: 'ride.html',   label: 'Ride & Ticket',
      words: ['ride', 'taxi', 'car', 'transport', 'ticket', 'bus', 'travel', 'driver', 'book a ride'] },
    { href: 'sanduq.html', label: 'Micro Finance',
      words: ['sanduq', 'micro finance', 'microfinance', 'micro', 'loan', 'credit', 'borrow', 'finance', 'financing'] },
    { href: 'donate.html', label: 'Donate & Charity',
      words: ['donate', 'donation', 'charity', 'zakat', 'sadaqa', 'give', 'help others', 'contribute'] },
    { href: 'work.html',   label: 'Zemen Work',
      words: ['work', 'job', 'jobs', 'freelance', 'employment', 'hire', 'career', 'task', 'gig'] }
  ];

  /* ---- Panel helpers ---- */
  function showPanel() {
    clearTimeout(panelTimer);
    $('voicePanel').classList.remove('hidden');
  }
  function hidePanel(delay) {
    clearTimeout(panelTimer);
    panelTimer = setTimeout(() => {
      if (!voiceBusy) $('voicePanel').classList.add('hidden');
    }, delay || 0);
  }
  function setStatus(title, sub, mode) {
    $('voiceStatus').textContent = title;
    $('voiceText').textContent   = sub || '';
    const pulse = $('voicePulse');
    const icon  = $('voicePulseIcon');
    pulse.className = 'w-10 h-10 rounded-full flex items-center justify-center shrink-0 transition-colors duration-200 ';
    if (mode === 'listening') {
      pulse.className += 'bg-emerald-100 pulse-ring relative';
      icon.className = 'fa-solid fa-microphone text-emerald-600 text-[14px]';
    } else if (mode === 'speaking') {
      pulse.className += 'bg-emerald-500';
      icon.className = 'fa-solid fa-volume-high text-white text-[14px]';
    } else if (mode === 'error') {
      pulse.className += 'bg-rose-50';
      icon.className = 'fa-solid fa-triangle-exclamation text-rose-500 text-[14px]';
    } else {
      pulse.className += 'bg-emerald-50';
      icon.className = 'fa-solid fa-microphone text-emerald-600 text-[14px]';
    }
  }

  /* ---- Speech synthesis ---- */
  let preferredVoice = null;
  function pickVoice() {
    if (!('speechSynthesis' in window)) return null;
    const voices = window.speechSynthesis.getVoices() || [];
    return voices.find(v => v.lang === 'en-US' && /zira|samantha|aria|jenny|google us english|female/i.test(v.name))
        || voices.find(v => v.lang === 'en-US')
        || voices.find(v => (v.lang || '').toLowerCase().startsWith('en'))
        || null;
  }
  if ('speechSynthesis' in window) {
    preferredVoice = pickVoice();
    window.speechSynthesis.onvoiceschanged = () => { preferredVoice = pickVoice(); };
  }

  function stopSpeaking() {
    if (!('speechSynthesis' in window)) return;
    try { window.speechSynthesis.cancel(); } catch (e) {}
    $('stopSpeakBtn').classList.add('hidden');
  }

  function speak(text) {
    if (!('speechSynthesis' in window)) return;
    try { window.speechSynthesis.cancel(); } catch (e) {}

    const u = new SpeechSynthesisUtterance(text);
    u.lang   = 'en-US';
    u.rate   = 1.0;
    u.pitch  = 1.0;
    u.volume = 1.0;
    if (preferredVoice) u.voice = preferredVoice;

    u.onstart = () => {
      voiceBusy = true;
      showPanel();
      setStatus('Zemen Assistant', text, 'speaking');
      $('stopSpeakBtn').classList.remove('hidden');
    };
    u.onend = () => {
      $('stopSpeakBtn').classList.add('hidden');
      if (!isListening) {
        voiceBusy = false;
        hidePanel(500);
      }
    };
    u.onerror = () => {
      $('stopSpeakBtn').classList.add('hidden');
      voiceBusy = isListening;
    };

    try { window.speechSynthesis.speak(u); } catch (e) {}
  }

  /* ---- Welcome (exactly once per session) ---- */
  function playWelcome() {
    if (!welcomePending) return;
    if (sessionStorage.getItem(WELCOME_KEY) === '1') { welcomePending = false; return; }
    welcomePending = false;
    try { sessionStorage.setItem(WELCOME_KEY, '1'); } catch (e) {}
    speak(WELCOME_TEXT);

    // If the browser blocked autoplay speech, allow a gesture-triggered retry.
    setTimeout(() => {
      const synth = window.speechSynthesis;
      if (!synth || !synth.speaking) welcomePending = true;
    }, 1000);
  }

  /* ---- Recognition ---- */
  function startListening() {
    if (isListening) return;

    if (!SR) {
      setStatus('Not supported', 'Voice input is unavailable in this browser', 'error');
      showPanel();
      voiceBusy = false;
      hidePanel(2600);
      toast('Voice input is not supported in this browser');
      return;
    }

    stopSpeaking();
    voiceBusy = true;
    finalText = '';
    handled   = false;

    const r = new SR();
    r.lang            = 'en-US';
    r.continuous      = true;
    r.interimResults  = true;
    r.maxAlternatives = 3;

    recognition = r;

    r.onstart = () => {
      isListening = true;
      showPanel();
      setStatus('Listening…', 'Speak now, release to send', 'listening');
      $('micRipple').classList.remove('hidden');
      $('micIcon').className = 'fa-solid fa-microphone text-white text-[20px] relative z-10';
      if (navigator.vibrate) { try { navigator.vibrate(12); } catch (e) {} }
    };

    r.onresult = (event) => {
      let interim = '';
      for (let i = event.resultIndex; i < event.results.length; i++) {
        const chunk = event.results[i][0].transcript;
        if (event.results[i].isFinal) finalText += chunk + ' ';
        else interim += chunk;
      }
      const live = (finalText + interim).trim();
      if (live) $('voiceText').textContent = live;
    };

    r.onerror = (event) => {
      isListening = false;
      $('micRipple').classList.add('hidden');

      if (event.error === 'not-allowed' || event.error === 'service-not-allowed') {
        handled = true;
        voiceBusy = false;
        setStatus('Microphone blocked', 'Allow mic access to use voice commands', 'error');
        hidePanel(3000);
        return;
      }
      if (event.error === 'no-speech') {
        handled = true;
        voiceBusy = false;
        setStatus('No speech detected', 'Press and hold the mic and try again', 'error');
        hidePanel(2400);
        return;
      }
      if (event.error === 'aborted') {
        handled = true;
        voiceBusy = false;
        hidePanel(200);
      }
    };

    r.onend = () => {
      isListening = false;
      $('micRipple').classList.add('hidden');
      if (handled) return;
      handled = true;
      handleTranscript(finalText.trim());
    };

    try { r.start(); }
    catch (err) {
      isListening = false;
      voiceBusy = false;
      hidePanel(0);
    }
  }

  function stopListening() {
    if (recognition && isListening) {
      try { recognition.stop(); } catch (e) {}
    }
  }

  /* ---- Intent resolution (fuzzy, weighted) ---- */
  function resolveIntent(raw) {
    const text = ' ' + raw.toLowerCase().replace(/[^a-z0-9\s]/g, ' ').replace(/\s+/g, ' ').trim() + ' ';

    // Special commands
    if (/(check|show|what.?s|tell).{0,12}(balance|wallet)|how much money|my balance/.test(text)) {
      return { type: 'balance' };
    }
    if (/(go |back )?home|dashboard|main page/.test(text)) {
      return { type: 'home' };
    }
    if (/(stop|cancel|never mind|nevermind|quiet)/.test(text)) {
      return { type: 'cancel' };
    }

    let best = null;
    let bestScore = 0;

    for (const intent of INTENTS) {
      let score = 0;
      for (const w of intent.words) {
        if (text.includes(' ' + w + ' ') || text.includes(w)) {
          score += w.split(' ').length * 2 + w.length / 12;
        }
      }
      if (score > bestScore) { bestScore = score; best = intent; }
    }

    return bestScore > 0 ? { type: 'app', app: best } : { type: 'unknown' };
  }

  function handleTranscript(text) {
    if (!text) {
      voiceBusy = false;
      setStatus('Didn\'t catch that', 'Press and hold the mic and try again', 'error');
      hidePanel(2400);
      speak('I did not catch that. Please press and hold the microphone and try again.');
      return;
    }

    const result = resolveIntent(text);
    voiceBusy = false;

    if (result.type === 'balance') {
      setStatus('Zemen Assistant', 'Checking your balance…', 'speaking');
      speak('Your demo wallet balance is ' + getBalance().toFixed(2) + ' birr.');
      return;
    }

    if (result.type === 'home') {
      window.scrollTo({ top: 0, behavior: 'smooth' });
      setStatus('Zemen Assistant', 'Going to your dashboard', 'speaking');
      speak('You are on the dashboard.');
      return;
    }

    if (result.type === 'cancel') {
      setStatus('Cancelled', 'Voice command cancelled', 'speaking');
      hidePanel(1200);
      return;
    }

    if (result.type === 'app') {
      const app = result.app;
      setStatus('Opening ' + app.label, 'Just a moment…', 'speaking');
      toast('Opening ' + app.label + '…');
      speak('Opening ' + app.label);
      setTimeout(() => { window.location.href = app.href; }, 750);
      return;
    }

    setStatus('Not sure about that', 'Try: "Food", "Equb", "Send money"…', 'error');
    hidePanel(2600);
    speak('Sorry, I did not find that service. Try saying food, equb, ride, or send money.');
  }

  /* ---- Mic bindings: press & hold ---- */
  function bindMic() {
    const mic = $('micBtn');
    if (!mic) return;

    mic.addEventListener('mousedown', (e) => { e.preventDefault(); startListening(); });
    mic.addEventListener('touchstart', (e) => { e.preventDefault(); startListening(); }, { passive: false });
    mic.addEventListener('contextmenu', (e) => e.preventDefault());

    document.addEventListener('mouseup', () => { if (isListening) stopListening(); });
    document.addEventListener('touchend', () => { if (isListening) stopListening(); });
    document.addEventListener('touchcancel', () => { if (isListening) stopListening(); });

    // Safety: if the tab loses focus mid-hold, release the mic.
    window.addEventListener('blur', () => { if (isListening) stopListening(); });

    $('stopSpeakBtn').addEventListener('click', (e) => {
      e.stopPropagation();
      stopSpeaking();
      voiceBusy = false;
      hidePanel(150);
    });
  }

  /* ---------------------------------------------------------------
     5. DASHBOARD INTERACTIONS
     --------------------------------------------------------------- */
  function bindDashboard() {
    // Balance visibility toggle
    $('toggleBal').addEventListener('click', () => {
      balanceHidden = !balanceHidden;
      $('eyeIcon').className = balanceHidden
        ? 'fa-regular fa-eye-slash text-[13px]'
        : 'fa-regular fa-eye text-[13px]';
      renderBalance();
    });

    // Add Money (demo cash-in)
    $('btnCashIn').addEventListener('click', () => {
      const next = getBalance() + 1000;
      setBalance(next);
      toast('1,000.00 ETB added to your demo wallet');
      if (navigator.vibrate) { try { navigator.vibrate(15); } catch (e) {} }
    });

    // Transfer → P2P mini app
    $('btnTransfer').addEventListener('click', () => {
      toast('Opening Ethio P2P…');
      setTimeout(() => { window.location.href = 'p2p.html'; }, 320);
    });

    // Scan QR
    $('btnScan').addEventListener('click', () => {
      toast('QR Scanner is not available in this demo');
    });

    // Generic toast triggers
    document.querySelectorAll('[data-toast]').forEach((el) => {
      el.addEventListener('click', () => toast(el.getAttribute('data-toast')));
    });

    // Bottom navigation
    document.querySelectorAll('.nav-item').forEach((btn) => {
      btn.addEventListener('click', () => {
        const key = btn.getAttribute('data-nav');

        document.querySelectorAll('.nav-item').forEach((b) => {
          b.classList.remove('text-emerald-600');
          b.classList.add('text-gray-400');
          b.querySelector('span').classList.remove('font-bold');
          b.querySelector('span').classList.add('font-semibold');
        });
        btn.classList.remove('text-gray-400');
        btn.classList.add('text-emerald-600');
        btn.querySelector('span').classList.remove('font-semibold');
        btn.querySelector('span').classList.add('font-bold');

        if (key === 'home') {
          window.scrollTo({ top: 0, behavior: 'smooth' });
        } else if (key === 'apps') {
          const section = $('appsSection');
          if (section) {
            const y = section.getBoundingClientRect().top + window.pageYOffset - 16;
            window.scrollTo({ top: y, behavior: 'smooth' });
          }
        } else if (key === 'finance') {
          toast('Finance hub — opening Sanduq Micro Finance…');
          setTimeout(() => { window.location.href = 'sanduq.html'; }, 380);
        } else {
          toast('Profile & KYC coming soon');
        }
      });
    });
  }

  /* ---------------------------------------------------------------
     6. BOOT SEQUENCE
     --------------------------------------------------------------- */
  function bootApp() {
    renderGrid();
    renderBalance();
    bindMic();
    bindDashboard();

    // Welcome voice — once per session, after the UI settles.
    setTimeout(playWelcome, 500);

    // Gesture fallback (covers browsers that block autoplay speech)
    const gestureRetry = () => {
      if (welcomePending) playWelcome();
      document.removeEventListener('pointerdown', gestureRetry);
      document.removeEventListener('touchstart', gestureRetry);
    };
    document.addEventListener('pointerdown', gestureRetry, { once: true });
    document.addEventListener('touchstart', gestureRetry, { once: true });
  }

  function runSplashFlow() {
    const splash = $('splash');
    const returning = (function () {
      try { return sessionStorage.getItem(SPLASH_KEY) === '1'; } catch (e) { return false; }
    })();

    if (returning) {
      // Returning from a mini-app → skip instantly, no delay, no flash.
      if (splash) splash.remove();
      bootApp();
      return;
    }

    // First visit in this session → show splash for 2s, then fade out.
    try { sessionStorage.setItem(SPLASH_KEY, '1'); } catch (e) {}

    document.body.style.overflow = 'hidden';

    setTimeout(() => {
      if (splash) {
        splash.classList.add('opacity-0');
        setTimeout(() => splash.remove(), 500);
      }
      document.body.style.overflow = '';
      bootApp();
    }, 2000);
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', runSplashFlow);
  } else {
    runSplashFlow();
  }
})();
</script>
