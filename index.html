<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Happy New Year 2019</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Arial', sans-serif;
            overflow: hidden;
        }

        .container {
            text-align: center;
            color: white;
            z-index: 10;
        }

        .countdown {
            display: flex;
            justify-content: center;
            gap: 30px;
            margin: 40px 0;
            flex-wrap: wrap;
        }

        .time-unit {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            padding: 30px;
            border-radius: 15px;
            border: 2px solid rgba(255, 255, 255, 0.3);
            min-width: 100px;
            animation: pulse 1s ease-in-out infinite;
        }

        .time-unit:nth-child(1) {
            animation-delay: 0s;
        }

        .time-unit:nth-child(2) {
            animation-delay: 0.1s;
        }

        .time-unit:nth-child(3) {
            animation-delay: 0.2s;
        }

        .time-unit:nth-child(4) {
            animation-delay: 0.3s;
        }

        @keyframes pulse {
            0%, 100% {
                transform: scale(1);
            }
            50% {
                transform: scale(1.05);
            }
        }

        .number {
            font-size: 48px;
            font-weight: bold;
            display: block;
            margin-bottom: 10px;
            text-shadow: 0 0 10px rgba(255, 255, 255, 0.5);
        }

        .label {
            font-size: 14px;
            text-transform: uppercase;
            letter-spacing: 2px;
            opacity: 0.9;
        }

        h1 {
            font-size: 60px;
            margin-bottom: 20px;
            text-shadow: 0 0 20px rgba(255, 255, 255, 0.5);
            animation: fadeInDown 1s ease-out;
        }

        @keyframes fadeInDown {
            from {
                opacity: 0;
                transform: translateY(-30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .message {
            font-size: 28px;
            margin-top: 50px;
            animation: fadeInUp 1s ease-out 0.5s both;
            font-weight: bold;
            text-shadow: 0 0 15px rgba(255, 255, 255, 0.6);
        }

        .confetti {
            position: fixed;
            width: 10px;
            height: 10px;
            background: #FFD700;
            pointer-events: none;
        }

        /* Responsive */
        @media (max-width: 600px) {
            h1 {
                font-size: 36px;
            }

            .number {
                font-size: 32px;
            }

            .message {
                font-size: 20px;
            }

            .countdown {
                gap: 15px;
            }

            .time-unit {
                padding: 20px;
                min-width: 80px;
            }
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🎉 Happy New Year 2019 🎉</h1>
        
        <div class="countdown">
            <div class="time-unit">
                <span class="number" id="days">0</span>
                <span class="label">Days</span>
            </div>
            <div class="time-unit">
                <span class="number" id="hours">0</span>
                <span class="label">Hours</span>
            </div>
            <div class="time-unit">
                <span class="number" id="minutes">0</span>
                <span class="label">Minutes</span>
            </div>
            <div class="time-unit">
                <span class="number" id="seconds">0</span>
                <span class="label">Seconds</span>
            </div>
        </div>

        <div class="message" id="message">
            ✨ Get Ready for an Amazing Year! ✨
        </div>
    </div>

    <script>
        function updateCountdown() {
            // Target date: January 1, 2019 at 00:00:00
            const targetDate = new Date('2019-01-01T00:00:00').getTime();
            const now = new Date().getTime();
            const difference = targetDate - now;

            if (difference > 0) {
                const days = Math.floor(difference / (1000 * 60 * 60 * 24));
                const hours = Math.floor((difference % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
                const minutes = Math.floor((difference % (1000 * 60 * 60)) / (1000 * 60));
                const seconds = Math.floor((difference % (1000 * 60)) / 1000);

                document.getElementById('days').textContent = String(days).padStart(2, '0');
                document.getElementById('hours').textContent = String(hours).padStart(2, '0');
                document.getElementById('minutes').textContent = String(minutes).padStart(2, '0');
                document.getElementById('seconds').textContent = String(seconds).padStart(2, '0');
            } else {
                // Countdown finished - show celebration message
                document.getElementById('days').textContent = '00';
                document.getElementById('hours').textContent = '00';
                document.getElementById('minutes').textContent = '00';
                document.getElementById('seconds').textContent = '00';
                document.getElementById('message').textContent = '🎊 HAPPY NEW YEAR 2019! 🎊';
                document.getElementById('message').style.fontSize = '32px';
                createConfetti();
            }
        }

        function createConfetti() {
            for (let i = 0; i < 50; i++) {
                const confetti = document.createElement('div');
                confetti.className = 'confetti';
                confetti.style.left = Math.random() * window.innerWidth + 'px';
                confetti.style.top = '-10px';
                confetti.style.backgroundColor = ['#FFD700', '#FF69B4', '#00CED1', '#32CD32', '#FF6347'][Math.floor(Math.random() * 5)];
                confetti.style.opacity = Math.random();
                document.body.appendChild(confetti);

                let top = 0;
                const duration = Math.random() * 2000 + 2000;
                const startTime = Date.now();

                function animate() {
                    const elapsed = Date.now() - startTime;
                    const progress = elapsed / duration;

                    if (progress < 1) {
                        confetti.style.top = (top + progress * window.innerHeight) + 'px';
                        confetti.style.left = (parseInt(confetti.style.left) + Math.sin(progress * Math.PI * 4) * 20) + 'px';
                        confetti.style.opacity = 1 - progress;
                        requestAnimationFrame(animate);
                    } else {
                        confetti.remove();
                    }
                }
                animate();
            }
        }

        // Update countdown every second
        updateCountdown();
        setInterval(updateCountdown, 1000);
    </script>
</body>
</html>
