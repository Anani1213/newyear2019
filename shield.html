function applyLang(lang){
  LANG = lang;
  $$('[data-i18n]').forEach(el => { el.textContent = t(el.dataset.i18n); });
  $$('[data-i18n-ph]').forEach(el => { el.placeholder = t(el.dataset.i18nPh); });

  const en = $('#langEn'), am = $('#langAm');
  if (lang === 'en'){
    en.className = 'px-2.5 py-1 rounded-full bg-zblue-900 text-white transition';
    am.className = 'px-2.5 py-1 rounded-full text-gray-500 transition';
  } else {
    am.className = 'px-2.5 py-1 rounded-full bg-zblue-900 text-white transition';
    en.className = 'px-2.5 py-1 rounded-full text-gray-500 transition';
  }
  // re-render any visible results in the new language
  if (lastSms)  renderResult(lastSms, '#smsResult');
  if (lastLink) renderResult(lastLink, '#linkResult');
}

const SCAM_NUMBERS = ['0912345678','0966778899','0987654321','0711223344','+251912345678','0911223344'];
const OFFICIAL_BRANDS = /(telebirr|tele birr|ethio\s*telecom|ethiotelecom|cbe|commercial bank|awash|dashen|abyssinia|zemen bank|mpesa|m-?pesa|safaricom)/i;

const URGENCY_PATTERNS = [
  { re:/\burgent\b/i,                 label:'“urgent”' },
  { re:/\bimmediately\b/i,            label:'“immediately”' },
  { re:/within\s+\d+\s*(hour|minute|day)/i, label:'artificial deadline' },
  { re:/(will be|has been|is)\s+(blocked|suspended|closed|deactivated|frozen)/i, label:'account-threat' },
  { re:/verify your account/i,        label:'“verify your account”' },
  { re:/click here/i,                 label:'“click here”' },
  { re:/\bclaim\b/i,                  label:'“claim”' },
  { re:/\b(winner|lottery|prize|jackpot)\b/i, label:'prize bait' },
  { re:/congratulations/i,            label:'“congratulations”' },
  { re:/share your (pin|password|otp)/i, label:'credential request' },
  { re:/act now|last warning|final notice/i, label:'pressure phrase' }
];

--------------------------------------------------------------------- */
const toNum = (s) => parseFloat(String(s).replace(/,/g, '')) || 0;
const fmt   = (n) => n.toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });

/* ---------------------------------------------------------------------
   5. SMS ANALYSIS ENGINE
--------------------------------------------------------------------- */
function analyzeSMS(raw){
  const text  = raw.trim();
  const checks = [];

  /* ---------- CHECK 1 — Transaction ID ---------- */
  const txnLabel = text.match(
    /(?:transaction\s*(?:id|no\.?|number|ref)|txn(?:\s*(?:id|no))?|ref(?:erence)?(?:\s*(?:no|number|id))?)\s*(?:is|:|-|=)?\s*/i
  );
  let txnVal = null;
  if (txnLabel){
    const after = text.slice(txnLabel.index + txnLabel[0].length);
    const m = after.match(/^([A-Za-z0-9\-]{4,24})/);
    txnVal = m ? m[1] : null;
  }
  if (txnVal && txnVal.length >= 6){
    checks.push({ key:'c_txn', status:'pass',
      detail:`Found a valid transaction reference: ${txnVal}` });
  } else if (txnVal){
    checks.push({ key:'c_txn', status:'warn', weight:10,
      detail:`Transaction reference “${txnVal}” is too short to be genuine.` });
  } else if (txnLabel){
    checks.push({ key:'c_txn', status:'fail', weight:22,
      detail:'The transaction ID field is present but completely empty — a classic fake-receipt trick.' });
  } else {
    checks.push({ key:'c_txn', status:'fail', weight:22,
      detail:'No transaction ID found. Genuine Telebirr / bank receipts always contain one.' });
  }

  /* ---------- CHECK 2 — Date format ---------- */
  const dateMatch = text.match(/(?:date|on)\s*[:\-]?\s*(\d{1,4})[\/\-.](\d{1,2})[\/\-.](\d{2,4})/i);
  if (dateMatch){
    let a = +dateMatch[1], b = +dateMatch[2], y = +dateMatch[3];
    let d = a, m = b;
    if (a > 31 || b > 12){ d = b; m = a; }          // try day/month swap
    if (y < 100) y += 2000;
    const validDay   = d >= 1 && d <= 31;
    const validMonth = m >= 1 && m <= 12;
    const validYear  = y >= 2020 && y <= 2035;
    if (validDay && validMonth && validYear){
      checks.push({ key:'c_date', status:'pass',
        detail:`Date “${dateMatch[0].replace(/^date\s*[:\-]?\s*/i,'')}” is a real calendar date.` });
    } else {
      checks.push({ key:'c_date', status:'fail', weight:14,
        detail:`Impossible date detected (day ${a}, month ${b}). Genuine systems never issue these.` });
    }
  } else {
    checks.push({ key:'c_date', status:'warn', weight:7,
      detail:'No date stamp found in the message.' });
  }

  /* ---------- CHECK 3 — Balance math ---------- */
  const prevRe   = /(?:previous|old|prior|before|opening)\s*balance[^0-9]{0,22}?([\d,]+(?:\.\d{1,2})?)/i;
  const newRe    = /(?:new|current|available|remaining|ending)\s*balance[^0-9]{0,22}?([\d,]+(?:\.\d{1,2})?)/i;
  const creditRe = /(?:received|credited|deposited|got|earned)[^0-9]{0,42}?([\d,]+(?:\.\d{1,2})?)/i;
  const debitRe  = /(?:sent|transferred|paid|debited|withdrawn|bought)[^0-9]{0,42}?([\d,]+(?:\.\d{1,2})?)/i;

  const prevM   = text.match(prevRe);
  const newM    = text.match(newRe);
  const creditM = text.match(creditRe);
  const debitM  = text.match(debitRe);

  const prev = prevM ? toNum(prevM[1]) : null;
  const nw   = newM  ? toNum(newM[1])  : null;
  const amt  = creditM ? toNum(creditM[1]) : (debitM ? toNum(debitM[1]) : null);
  const isCredit = !!creditM;

  if (prev !== null && nw !== null && amt !== null){
    const expected = isCredit ? prev + amt : prev - amt;
    const diff = Math.abs(expected - nw);
    if (diff < 0.02){
      checks.push({ key:'c_math', status:'pass',
        detail:`Balance reconciles perfectly: ${fmt(prev)} ${isCredit ? '+' : '−'} ${fmt(amt)} = ${fmt(nw)} ETB.` });
    } else {
      checks.push({ key:'c_math', status:'fail', weight:26,
        detail:`Balance math is WRONG. ${fmt(prev)} ${isCredit ? '+' : '−'} ${fmt(amt)} should equal ${fmt(expected)} ETB, but the SMS claims ${fmt(nw)} ETB. This is the #1 signature of a fake receipt.` });
    }
  } else if (nw !== null && amt !== null){
    checks.push({ key:'c_math', status:'info',
      detail:'A new balance and an amount were found, but no previous balance — arithmetic cannot be verified. Ask the sender for a full receipt.' });
  } else if (amt !== null || nw !== null){
    checks.push({ key:'c_math', status:'warn', weight:8,
      detail:'Amounts are mentioned but the message is missing the balance figures needed to verify the transaction.' });
  } else {
    checks.push({ key:'c_math', status:'info',
      detail:'No transaction amounts were detected in this message.' });
  }

  /* ---------- CHECK 4 — Embedded links ---------- */
  const linkM = text.match(/(https?:\/\/[^\s]+|www\.[^\s]+)/i);
  if (linkM){
    const url = linkM[1];
    const insecure = /^http:\/\//i.test(url);
    checks.push({ key:'c_link', status:'fail', weight: insecure ? 24 : 20,
      detail:`Embedded link found: ${url}. Official Telebirr and bank SMS never contain links${insecure ? ' — and this one is unencrypted (http://).' : '.'}` });
  } else {
    checks.push({ key:'c_link', status:'pass',
      detail:'No links embedded — consistent with genuine transactional SMS.' });
  }

  /* ---------- CHECK 5 — Contact / scammer numbers ---------- */
  const contactCtx = /(call|contact|dial|phone|whatsapp|telegram|reach|ይደውሉ|ያግኙ)/i.test(text);
  const phones = (text.match(/(?:\+251|0)?[79]\d{8}/g) || []).map(p => p.replace(/[\s\-]/g,''));
  const blacklisted = phones.filter(p => SCAM_NUMBERS.some(s => p.includes(s.replace('+251','')) || s.includes(p)));

  if (blacklisted.length){
    checks.push({ key:'c_contact', status:'fail', weight:16,
      detail:`Message pushes you to call ${blacklisted[0]} — this number is on Zemen Shield's known-scammer list.` });
  } else if (contactCtx && phones.length){
    checks.push({ key:'c_contact', status:'warn', weight:9,
      detail:`Asks you to contact a personal number (${phones[0]}). Genuine providers use official shortcodes such as 127.` });
  } else if (contactCtx){
    checks.push({ key:'c_contact', status:'warn', weight:6,
      detail:'Contains a request to contact someone — verify the number through official channels first.' });
  } else {
    checks.push({ key:'c_contact', status:'pass',
      detail:'No request to call or contact an unknown number.' });
  }

  /* ---------- CHECK 6 — Pressure / social-engineering language ---------- */
  const hits = URGENCY_PATTERNS.filter(p => p.re.test(text)).map(p => p.label);
  if (hits.length >= 3){
    checks.push({ key:'c_urgency', status:'fail', weight:14,
      detail:`Heavy pressure language detected (${hits.length} triggers): ${hits.slice(0,4).join(', ')}. Scammers manufacture urgency so you act without thinking.` });
  } else if (hits.length >= 1){
    checks.push({ key:'c_urgency', status:'warn', weight:7,
      detail:`Mild pressure language detected: ${hits.join(', ')}.` });
  } else {
    checks.push({ key:'c_urgency', status:'pass',
      detail:'Calm, neutral wording — no psychological pressure tactics.' });
  }

  /* ---------- CHECK 7 — Formatting / grammar ---------- */
  const capsWords = (text.match(/\b[A-Z]{4,}\b/g) || []).filter(w => !/^(ETB|SMS|OTP|PIN|ID)$/.test(w));
  const bangs     = (text.match(/!{2,}/g) || []).length;
  if (capsWords.length >= 2 || bangs >= 1){
    checks.push({ key:'c_format', status:'warn', weight:8,
      detail:`Unprofessional formatting (${capsWords.length} shouting word${capsWords.length===1?'':'s'}, ${bangs} “!!”). Official bank messages are formally formatted.` });
  } else {
    checks.push({ key:'c_format', status:'pass',
      detail:'Formatting matches official provider standards.' });
  }

  /* ---------- CHECK 8 — Branding ---------- */
  if (OFFICIAL_BRANDS.test(text)){
    checks.push({ key:'c_brand', status:'pass',
      detail:'Mentions a known Ethiopian financial brand — remember, brand names are trivially copied by scammers.' });
  } else {
    checks.push({ key:'c_brand', status:'warn', weight:6,
      detail:'No recognisable provider branding found in the message.' });
  }

  /* ---------- SCORING ---------- */
  let risk = 0;
  checks.forEach(c => {
    if (c.status === 'fail') risk += (c.weight || 15);
    else if (c.status === 'warn') risk += (c.weight || 5);
  });
  risk = Math.min(100, Math.round(risk));

  let verdict = 'genuine';
  if (risk >= 50) verdict = 'fake';
  else if (risk >= 22) verdict = 'suspicious';

  return { type:'sms', verdict, risk, checks };
}

/* ---------------------------------------------------------------------
   6. LINK ANALYSIS ENGINE
--------------------------------------------------------------------- */
const OFFICIAL_DOMAINS = [
  'telebirr.et','ethiotelecom.et','cbe.com.et','awashbank.com','dashenbank.com',
  'bankofabyssinia.com','zemenbank.com','mpesa.et','safaricom.et','nibbank.com',
  'berhanbank.com','wegagen.com','unitedbank.com.et','coopbankoromia.com.et','abaybank.com.et'
];
const BAD_TLDS = ['xyz','tk','top','gq','ml','cf','ga','work','click','link','review','country','stream','download','racing','win','bid','loan','date','men','party'];
const SHORTENERS = ['bit.ly','tinyurl.com','t.co','goo.gl','is.gd','cutt.ly','rb.gy','shorturl.at','ow.ly','buff.ly','rebrand.ly','shorte.st'];
const SENSITIVE_WORDS = ['login','signin','verify','verification','account','update','confirm','secure','otp','pin','password','wallet','claim','prize','bonus','refund','unlock','suspend'];
const BRAND_WORDS = ['telebirr','ethiotelecom','ethio-telecom','cbe','awash','dashen','abyssinia','zemen','mpesa','safaricom'];

function analyzeLink(raw){
  const checks = [];
  let input = raw.trim();
  if (!input){
    return { type:'link', verdict:'suspicious', risk:0,
      checks:[{ key:'c_invalid', status:'fail', weight:0, detail:'Please enter a link to scan.' }] };
  }

  let url;
  try {
    url = new URL(/^https?:\/\//i.test(input) ? input : 'http://' + input);
  } catch (e) {
    return { type:'link', verdict:'suspicious', risk:60,
      checks:[{ key:'c_invalid', status:'fail', weight:60, detail:'This is not a valid, well-formed web address.' }] };
  }

  const host = url.hostname.toLowerCase();
  const full = url.href;
  const root = host.split('.').slice(-2).join('.');

  /* Protocol */
  if (url.protocol === 'https:'){
    checks.push({ key:'c_protocol', status:'pass', detail:'Uses HTTPS — the connection is encrypted.' });
  } else {
    checks.push({ key:'c_protocol', status:'fail', weight:14,
      detail:'Uses plain HTTP. Anything you type on this page can be intercepted.' });
  }

  /* IP host */
  if (/^\d{1,3}(\.\d{1,3}){3}$/.test(host)){
    checks.push({ key:'c_ip', status:'fail', weight:28,
      detail:'The link points to a raw IP address instead of a real domain — a strong phishing indicator.' });
  } else {
    checks.push({ key:'c_ip', status:'pass', detail:'Hosted on a named domain, not a bare IP address.' });
  }

  /* Official domain? */
  const isOfficial = OFFICIAL_DOMAINS.some(d => host === d || host.endsWith('.' + d));
  if (isOfficial){
    checks.push({ key:'c_domain', status:'pass',
      detail:`${root} is a verified Ethiopian financial domain.` });
  } else {
    /* Impersonation */
    const impersonated = BRAND_WORDS.find(b => host.includes(b));
    if (impersonated){
      checks.push({ key:'c_impersonation', status:'fail', weight:30,
        detail:`This domain imitates “${impersonated}” but is NOT the official site (${root}). Classic brand impersonation.` });
    } else {
      checks.push({ key:'c_domain', status:'warn', weight:8,
        detail:`${root} is not on Zemen Shield's verified financial-domain list.` });
    }
  }

  /* TLD */
  const tld = host.split('.').pop();
  if (BAD_TLDS.includes(tld)){
    checks.push({ key:'c_tld', status:'fail', weight:18,
      detail:`The “.${tld}” extension is heavily abused by fraud campaigns and is rarely used by real banks.` });
  } else {
    checks.push({ key:'c_tld', status:'pass', detail:`“.${tld}” is not on the high-abuse extension list.` });
  }

  /* Shortener */
  if (SHORTENERS.some(s => host === s || host.endsWith('.' + s))){
    checks.push({ key:'c_shortener', status:'fail', weight:16,
      detail:'This is a URL shortener — the true destination is hidden from you.' });
  } else {
    checks.push({ key:'c_shortener', status:'pass', detail:'Not a hidden-destination short link.' });
  }

  /* Punycode */
  if (host.includes('xn--')){
    checks.push({ key:'c_punycode', status:'fail', weight:22,
      detail:'Uses punycode (xn--), a technique used to fake look-alike characters in domain names.' });
  } else {
    checks.push({ key:'c_punycode', status:'pass', detail:'No look-alike character tricks detected.' });
  }

  /* @ trick */
  if (full.includes('@') && full.indexOf('@') < full.indexOf(host)){
    checks.push({ key:'c_domain', status:'fail', weight:24,
      detail:'Contains an “@” before the domain — everything before it is ignored by the browser. A known deception trick.' });
  }

  /* Hyphens / subdomain depth */
  const hyphens = (host.match(/-/g) || []).length;
  const dots = (host.match(/\./g) || []).length;
  if (hyphens >= 3 || dots >= 4){
    checks.push({ key:'c_domain', status:'warn', weight:8,
      detail:`Unusually complex hostname (${hyphens} hyphens, ${dots} sub-levels) — typical of throwaway phishing domains.` });
  }

  /* Sensitive keywords */
  const found = SENSITIVE_WORDS.filter(w => full.toLowerCase().includes(w));
  if (found.length >= 2){
    checks.push({ key:'c_keywords', status:'fail', weight:14,
      detail:`Contains credential-harvesting keywords: ${found.slice(0,4).join(', ')}.` });
  } else if (found.length === 1){
    checks.push({ key:'c_keywords', status:'warn', weight:7,
      detail:`Contains the sensitive keyword “${found[0]}”.` });
  } else {
    checks.push({ key:'c_keywords', status:'pass', detail:'No credential-harvesting keywords in the path.' });
  }

  /* Length */
  if (full.length > 90){
    checks.push({ key:'c_length', status:'warn', weight:6,
      detail:`Very long URL (${full.length} characters) designed to hide the real destination.` });
  } else {
    checks.push({ key:'c_length', status:'pass', detail:'URL length is normal.' });
  }

  let risk = 0;
  checks.forEach(c => {
    if (c.status === 'fail') risk += (c.weight || 15);
    else if (c.status === 'warn') risk += (c.weight || 5);
  });
  risk = Math.min(100, Math.round(risk));

  let verdict = 'genuine';
  if (risk >= 50) verdict = 'fake';
  else if (risk >= 22) verdict = 'suspicious';

  return { type:'link', verdict, risk, checks };
}

const THEME = {
  fake: {
    wrap:'bg-red-50 border-red-200', text:'text-red-700', solid:'bg-red-600',
    bar:'bg-red-500', icon:'fa-triangle-exclamation', inner:'bg-white/70 border-red-200'
  },
  suspicious: {
    wrap:'bg-amber-50 border-amber-200', text:'text-amber-700', solid:'bg-amber-500',
    bar:'bg-amber-500', icon:'fa-circle-exclamation', inner:'bg-white/70 border-amber-200'
  },
  genuine: {

    bar:'bg-green-500', icon:'fa-circle-check', inner:'bg-white/70 border-green-200'
  }
};

const STATUS_ICON = {
  pass: ['fa-circle-check', 'text-zgreen-600'],
  fail: ['fa-circle-xmark', 'text-red-600'],
  warn: ['fa-circle-exclamation', 'text-amber-500'],
  info: ['fa-circle-info', 'text-blue-500']
};

function renderResult(res, targetSel){
  const el = $(targetSel);
  if (!el) return;

  const th = THEME[res.verdict];
  const isSms = res.type === 'sms';

  let title, sub;
  if (isSms){
    if (res.verdict === 'fake'){ title = t('fake'); sub = t('fakeSub'); }
    else if (res.verdict === 'suspicious'){ title = t('suspicious'); sub = t('suspiciousSub'); }
    else { title = t('genuine'); sub = t('genuineSub'); }
  } else {
    if (res.verdict === 'fake'){ title = t('dangerous'); sub = t('dangerousSub'); }
    else if (res.verdict === 'suspicious'){ title = t('suspicious'); sub = t('suspiciousSub'); }
    else { title = t('safe'); sub = t('safeSub'); }
  }

  const rows = res.checks.map(c => {
    const [icon, color] = STATUS_ICON[c.status] || STATUS_ICON.info;
    return `
      <li class="flex items-start gap-2.5">
        <i class="fa-solid ${icon} ${color} text-[13px] mt-[2px] shrink-0"></i>
        <div class="min-w-0">
          <p class="text-[12.5px] font-bold text-gray-800 leading-tight">${t(c.key)}</p>
          <p class="text-[11.5px] text-gray-500 leading-snug mt-0.5">${c.detail}</p>
        </div>
      </li>`;
  }).join('');

  const advice = (res.verdict === 'fake') ? `
    <div class="mx-4 mb-4 rounded-xl bg-red-600 text-white p-3.5">
      <p class="text-[12px] font-extrabold flex items-center gap-1.5">
        <i class="fa-solid fa-hand"></i>${t('whatToDo')}
      </p>
      <ul class="text-[11.5px] mt-2 space-y-1.5 leading-snug opacity-95">
        <li class="flex gap-2"><span>•</span><span>${t('adv1')}</span></li>
        <li class="flex gap-2"><span>•</span><span>${t('adv2')}</span></li>
        <li class="flex gap-2"><span>•</span><span>${t('adv3')}</span></li>
      </ul>
    </div>` : '';

  el.innerHTML = `
    <div class="pop rounded-2xl border-2 ${th.wrap} overflow-hidden ${res.verdict === 'fake' ? 'shake' : ''}">
      <div class="p-4">
        <div class="flex items-start gap-3">
          <div class="w-11 h-11 rounded-full ${th.solid} flex items-center justify-center text-white text-[17px] shrink-0 shadow-sm">
            <i class="fa-solid ${th.icon}"></i>
          </div>
          <div class="flex-1 min-w-0">
            <p class="font-extrabold text-[13.5px] ${th.text} leading-tight tracking-tight">${title}</p>
            <p class="text-[11.5px] text-gray-600 mt-1 leading-snug">${sub}</p>
          </div>
          <div class="text-right shrink-0">
            <p class="text-[9px] uppercase tracking-wider text-gray-500 font-extrabold">${t('risk')}</p>
            <p class="text-[22px] font-extrabold ${th.text} leading-none mt-0.5">${res.risk}%</p>
          </div>
        </div>
        <div class="mt-3.5 h-2 rounded-full bg-white/80 overflow-hidden">
          <div class="h-full ${th.bar} rounded-full transition-all duration-700 ease-out" style="width:${res.risk}%"></div>
        </div>
      </div>

      <div class="${th.inner} border-t p-4">
        <p class="text-[10px] font-extrabold uppercase tracking-wider text-gray-500 mb-3">${t('checksTitle')}</p>
        <ul class="space-y-3">${rows}</ul>
      </div>

      ${advice}

      <div class="px-4 pb-3.5 -mt-1">
        <p class="text-[10.5px] text-gray-400 flex items-center gap-1.5">
          <i class="fa-solid fa-lock text-[9px]"></i>${t('offline')}
        </p>
      </div>
    </div>`;

  // scroll result into view smoothly
  setTimeout(() => el.scrollIntoView({ behavior:'smooth', block:'nearest' }), 80);
}

/* ---------------------------------------------------------------------
   8. SCAN HISTORY / STATS
--------------------------------------------------------------------- */
const HISTORY = { scans:0, threats:0, safe:0, links:0, last:[] };

function recordScan(res){
  HISTORY.scans++;
  if (res.verdict === 'fake') HISTORY.threats++;
  if (res.verdict === 'genuine') HISTORY.safe++;
  if (res.type === 'link') HISTORY.links++;
  HISTORY.last.unshift({
    type: res.type, verdict: res.verdict, risk: res.risk,
    time: new Date().toLocaleTimeString([], { hour:'2-digit', minute:'2-digit' })
  });
  HISTORY.last = HISTORY.last.slice(0, 8);
}

const sheet = $('#sheet');
const backdrop = $('#sheetBackdrop');

function openSheet(html){
  $('#sheetContent').innerHTML = html;
  backdrop.classList.remove('hidden');
  requestAnimationFrame(() => {
    backdrop.classList.add('opacity-100');
    sheet.classList.remove('translate-y-full');
  });
}
function closeSheet(){
  backdrop.classList.remove('opacity-100');
  sheet.classList.add('translate-y-full');
  setTimeout(() => backdrop.classList.add('hidden'), 300);
}
backdrop.addEventListener('click', closeSheet);

/* --- USSD Simulator --- */
let ussdBuf = '';
let ussdResponse = '';

const USSD_CODES = {
  '*127#': 'Telebirr\n\n1. Send Money\n2. Buy Airtime\n3. Check Balance\n4. My Account\n5. Mini Statement\n0. Exit',
  '*804#': 'Ethio Telecom\n\n1. My Balance\n2. Buy Package\n3. My Number\n4. Customer Care\n0. Back',
  '*999#': 'Emergency Services\n\n1. Police — 991\n2. Ambulance — 907\n3. Fire — 939\n4. Fraud Report — 127\n0. Back',
  '*806#': 'Zemen Bank\n\n1. Account Balance\n2. Mini Statement\n3. Block Card\n0. Exit',
  '*889#': 'Amole / Dashen\n\n1. Balance\n2. Transfer\n3. Airtime\n0. Exit'
};

function ussdScreenHTML(){
  const display = ussdResponse
    ? ussdResponse
    : (ussdBuf || 'Enter a USSD code…');
  const color = ussdResponse ? 'text-zgreen-400' : (ussdBuf ? 'text-white' : 'text-blue-300/50');
  return `<p id="ussdScreen" class="font-mono text-[12.5px] leading-relaxed whitespace-pre-line ${color}">${display}</p>`;
}

function ussdRender(){
  openSheet(`
    <div class="text-center">
      <h3 class="font-extrabold text-zblue-900 text-[15px]">USSD Simulator</h3>
      <p class="text-[11.5px] text-gray-500 mt-1">Mock dialer — no real network calls are made.</p>
    </div>

    <div class="mt-4 rounded-2xl bg-zblue-950 p-4 min-h-[140px] flex items-start">
      ${ussdScreenHTML()}
    </div>

    <div class="grid grid-cols-3 gap-2.5 mt-4">
      ${['1','2','3','4','5','6','7','8','9','*','0','#'].map(k => `
        <button data-key="${k}" class="keypad-btn py-3.5 rounded-xl bg-gray-50 border border-gray-200 text-[17px] font-bold text-zblue-900 transition">${k}</button>
      `).join('')}
    </div>

    <div class="grid grid-cols-2 gap-2.5 mt-2.5">
      <button data-key="del" class="py-3.5 rounded-xl bg-gray-100 text-gray-600 text-[13px] font-bold active:scale-[.97] transition">
        <i class="fa-solid fa-delete-left mr-1"></i>Back
      </button>
      <button data-key="send" class="py-3.5 rounded-xl bg-zgreen-600 text-white text-[13px] font-extrabold shadow-lg shadow-green-600/25 active:scale-[.97] transition">
        <i class="fa-solid fa-phone mr-1"></i>Send
      </button>
    </div>

    <div class="mt-4">
      <p class="text-[10px] font-extrabold uppercase tracking-wider text-gray-400 mb-2">Quick codes</p>
      <div class="flex flex-wrap gap-2">
        ${Object.keys(USSD_CODES).map(c => `
          <button data-quick="${c}" class="px-3 py-1.5 rounded-full bg-zblue-900/5 border border-zblue-900/10 text-[11.5px] font-bold text-zblue-900 active:scale-95 transition">${c}</button>
        `).join('')}
      </div>
    </div>
  `);
}

document.addEventListener('click', (e) => {
  const keyBtn = e.target.closest('[data-key]');
  if (keyBtn && $('#ussdScreen')){
    const k = keyBtn.dataset.key;
    if (k === 'del'){ ussdBuf = ussdBuf.slice(0, -1); ussdResponse = ''; }
    else if (k === 'send'){
      ussdResponse = USSD_CODES[ussdBuf] || `Unknown service code: ${ussdBuf || '(empty)'}\n\nPlease check the code and try again.`;
    } else {
      ussdResponse = '';
      if (ussdBuf.length < 18) ussdBuf += k;
    }
    const scr = $('#ussdScreen');
    if (scr){
      const wrap = scr.parentElement;
      wrap.innerHTML = ussdScreenHTML();
    }
    return;
  }

  const quick = e.target.closest('[data-quick]');
  if (quick && $('#ussdScreen')){
    ussdBuf = quick.dataset.quick;
    ussdResponse = USSD_CODES[ussdBuf] || 'Unknown service code.';
    const scr = $('#ussdScreen');
    if (scr) scr.parentElement.innerHTML = ussdScreenHTML();
  }
});

/* --- Stats --- */

    ? HISTORY.last.map(h => {
        const c = h.verdict === 'fake' ? 'text-red-600 bg-red-50'
                : h.verdict === 'suspicious' ? 'text-amber-600 bg-amber-50'
                : 'text-zgreen-700 bg-zgreen-100';
        const label = h.verdict === 'fake' ? 'Fraud' : h.verdict === 'suspicious' ? 'Suspicious' : 'Clean';
        return `
          <div class="flex items-center justify-between py-2.5 border-b border-gray-100 last:border-0">
            <div class="flex items-center gap-2.5">
              <i class="fa-solid ${h.type === 'link' ? 'fa-link' : 'fa-comment-dots'} text-gray-400 text-[11px] w-3"></i>

              <span class="text-[10.5px] font-bold px-2 py-1 rounded-full ${c}">${label} · ${h.risk}%</span>
            </div>
          </div>`;
      }).join('')
    : `<p class="text-[12px] text-gray-400 text-center py-6">No scans yet this session.</p>`;

  openSheet(`
    <h3 class="font-extrabold text-zblue-900 text-[15px]">Protection Stats</h3>
    <p class="text-[11.5px] text-gray-500 mt-1">Session-only — nothing is stored permanently.</p>

    <div class="grid grid-cols-3 gap-2.5 mt-4">

        <p class="text-[10px] text-blue-200/80 mt-1.5 font-semibold">Total scans</p>
      </div>
      <div class="rounded-2xl bg-red-50 border border-red-100 p-3.5">
        <p class="text-[22px] font-extrabold leading-none text-red-600">${HISTORY.threats}</p>
        <p class="text-[10px] text-red-500/80 mt-1.5 font-semibold">Threats</p>
      </div>
      <div class="rounded-2xl bg-zgreen-50 border border-zgreen-100 p-3.5">
        <p class="text-[22px] font-extrabold leading-none text-zgreen-700">${HISTORY.safe}</p>
        <p class="text-[10px] text-zgreen-700/80 mt-1.5 font-semibold">Clean</p>

    </div>

    <div class="mt-4 rounded-2xl bg-gray-50 border border-gray-100 p-4">
      <div class="flex items-center justify-between mb-2">
        <p class="text-[11px] font-extrabold uppercase tracking-wider text-gray-500">Threat ratio</p>
        <p class="text-[12px] font-extrabold text-zblue-900">${pct}%</p>
      </div>
      <div class="h-2 rounded-full bg-gray-200 overflow-hidden">
        <div class="h-full bg-red-500 rounded-full transition-all duration-700" style="width:${pct}%"></div>
      </div>
    </div>

    <p class="text-[10px] font-extrabold uppercase tracking-wider text-gray-400 mt-5 mb-1">Recent activity</p>
    <div>${rows}</div>
  `);
}

/* --- Bottom nav --- */
$$('[data-nav]').forEach(btn => {

    const nav = btn.dataset.nav;

    $$('[data-nav]').forEach(b => {
      const active = b.dataset.nav === nav;
      b.classList.toggle('text-zgreen-600', active);
      b.classList.toggle('text-gray-400', !active);
    });

    if (nav === 'shield'){ closeSheet(); window.scrollTo({ top:0, behavior:'smooth' }); return; }

    if (nav === 'alerts'){ alertsRender(); return; }
    if (nav === 'stats'){ statsRender(); return; }

  });
});
