<style>

  .fade { animation: f .18s ease-out; }
  @keyframes f { from {opacity:0; transform:translateY(6px)} to {opacity:1; transform:none} }
  .ussd-screen { font-family: ui-monospace, Menlo, Consolas, monospace; }
  .langseg { background:#f1f5f9; padding:3px; border-radius:9999px; }
  .langseg button { padding:.3rem .7rem; border-radius:9999px; font-size:11px; font-weight:700; transition: all .15s ease; }
  .langseg button.on { background:#0B2A5B; color:#fff; box-shadow:0 1px 4px rgba(11,42,91,.35); }
  .langseg button.off { background:transparent; color:#64748b; }
  /* Splash screen */
  #splash { display: flex; flex-direction: column; align-items: center; justify-content: center; }
  .splash-logo { position: relative; width: 96px; height: 96px; }
  .splash-logo svg { position: relative; z-index: 10; filter: drop-shadow(0 0 14px rgba(140,198,63,.55)); }
  .pulse-ring { position: absolute; inset: 0; border-radius: 50%; background: rgba(140,198,63,.18); animation: splashPulse 1.6s ease-out infinite; }
  .pulse-ring:nth-child(2) { animation-delay: .55s; }
  @keyframes splashPulse { 0% { transform: scale(.6); opacity: .9; } 100% { transform: scale(1.7); opacity: 0; } }
  .splash-bar { width: 180px; height: 4px; background: rgba(255,255,255,.18); border-radius: 999px; overflow: hidden; margin-top: 2.5rem; }
  .splash-bar::after { content: ""; display: block; height: 100%; width: 0%; background: #8CC63F; border-radius: 999px; animation: splashLoad 2.6s ease-in-out forwards; }
  @keyframes splashLoad { 0% { width: 0%; } 100% { width: 100%; } }

<body class="bg-slate-200 text-slate-800">

<!-- SPLASH SCREEN -->
<div id="splash" class="fixed inset-0 z-50 bg-blue-900 transition-opacity duration-500">
  <div class="splash-logo">
    <div class="pulse-ring"></div>
    <div class="pulse-ring"></div>
    <svg viewBox="0 0 24 24" class="w-24 h-24" fill="none">
      <path d="M12 2.6l7 2.8v5.4c0 4.5-2.9 8.3-7 9.6-4.1-1.3-7-5.1-7-9.6V5.4l7-2.8z" fill="#8CC63F"/>
      <path d="M8.6 12.1l2.4 2.4 4.4-4.6" stroke="#0B2A5B" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
  </div>
  <h1 class="mt-6 text-2xl font-bold text-white tracking-tight">Telebirr FraudShield</h1>
  <p class="mt-1 text-sm text-blue-200">Detect Fraud &bull; Stay Safe</p>
  <div class="splash-bar"></div>
</div>

<div class="mx-auto max-w-md min-h-screen bg-slate-50 flex flex-col shadow-xl">

  <!-- HEADER -->

    <div class="flex items-center gap-3">
      <div class="w-11 h-11 rounded-2xl bg-etblue grid place-items-center shrink-0 shadow-sm">
        <svg viewBox="0 0 24 24" class="w-6 h-6" fill="none">
          <path d="M12 2.6l7 2.8v5.4c0 4.5-2.9 8.3-7 9.6-4.1-1.3-7-5.1-7-9.6V5.4l7-2.8z" fill="#8CC63F"/>
          <path d="M8.6 12.1l2.4 2.4 4.4-4.6" stroke="#0B2A5B" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </div>
      <div class="flex-1 min-w-0">
        <p class="font-bold text-etblue leading-tight truncate">Telebirr FraudShield</p>
        <p class="text-xs text-gray-500">Detect fraud • Stay safe</p>
      </div>
      <div class="langseg flex gap-1">
        <button id="btnEn" onclick="setLang('en')" class="off">EN</button>
        <button id="btnAm" onclick="setLang('am')" class="off">አማርኛ</button>
      </div>
      <img id="uPhoto" src="" alt="" class="w-10 h-10 rounded-full border-2 border-etlime object-cover hidden" />
      <div id="uInitial" class="w-10 h-10 rounded-full bg-etblue text-white font-bold grid place-items-center text-base shrink-0">U</div>
    </div>

    <div class="mt-3 flex items-center gap-2">
      <span class="w-2 h-2 rounded-full bg-etlime shadow-[0_0_0_3px_rgba(140,198,63,.2)]"></span>
      <p id="uName" class="text-xs font-semibold text-slate-600">Guest User</p>
      <p id="headSub" class="text-[10px] text-slate-400 truncate"></p>
    </div>
  </header>

  <main class="flex-1 p-4 pb-28">

    <!-- TAB 1: SMS SHIELD -->
    <section id="tab-sms" class="fade">
      <div class="relative overflow-hidden rounded-2xl bg-etblue p-5 shadow-lg">
        <div class="absolute -right-10 -top-10 w-40 h-40 rounded-full bg-gradient-to-br from-teal-400/30 to-etlime/10"></div>
        <div class="absolute -right-4 top-14 w-24 h-24 rounded-full bg-teal-300/10"></div>
        <div class="relative">
          <h2 id="tSmsTitle" class="text-lg font-bold text-white"></h2>
          <p id="tSmsSub" class="text-xs text-slate-300 mt-1 max-w-[80%]"></p>
        </div>
      </div>

      <div class="mt-4 bg-white shadow-md rounded-2xl p-4">
        <textarea id="smsInput" rows="6" data-ph="phSms"
          class="w-full rounded-xl border border-slate-200 bg-slate-50 p-3 text-sm focus:outline-none focus:ring-2 focus:ring-etlime focus:bg-white"></textarea>

        <div class="grid grid-cols-2 gap-3 mt-3">
          <button id="tRealDemo" onclick="fillReal()" class="rounded-xl bg-green-100 text-green-700 text-xs font-bold py-3 active:scale-[0.98] transition"></button>
          <button id="tFakeDemo" onclick="fillFake()" class="rounded-xl bg-red-100 text-red-700 text-xs font-bold py-3 active:scale-[0.98] transition"></button>
        </div>

        <button id="tScanBtn" onclick="runScan()" class="w-full mt-3 bg-etlime hover:bg-etlime2 text-etblue font-bold py-3 rounded-xl shadow-sm active:scale-[0.99] transition"></button>
        <button id="tClear" onclick="clearScan()" class="w-full mt-2 text-xs text-slate-400 py-1"></button>
      </div>

      <div id="smsResult" class="mt-4"></div>
    </section>

    <!-- TAB 2: USSD -->
    <section id="tab-ussd" class="hidden fade">
      <div class="bg-white shadow-md rounded-2xl p-4">
        <h2 id="tUssdTitle" class="text-lg font-bold text-etblue"></h2>
        <p id="tUssdSub" class="text-xs text-slate-500 mb-3"></p>

        <div class="bg-etblue rounded-2xl p-4">
          <div id="ussdScreen" class="ussd-screen bg-[#0f172a] text-etlime text-[13px] leading-relaxed rounded-xl p-3 min-h-[190px] whitespace-pre-wrap"></div>
          <div class="mt-3 flex gap-2">
            <input id="ussdInput" inputmode="numeric" data-ph="phUssd"
              class="flex-1 rounded-lg px-3 py-2 text-sm text-slate-800" />
            <button id="tUssdSend" onclick="ussdSend()" class="bg-etlime text-etblue font-bold px-4 rounded-lg"></button>
          </div>
          <div class="mt-2 grid grid-cols-3 gap-2">
            <button id="tDial" onclick="ussdDial()" class="bg-white/10 text-white text-xs py-2 rounded-lg"></button>
            <button id="tBack" onclick="ussdBack()" class="bg-white/10 text-white text-xs py-2 rounded-lg"></button>
            <button id="tEnd" onclick="ussdEnd()" class="bg-red-500 text-white text-xs py-2 rounded-lg"></button>
          </div>
        </div>
      </div>
    </section>

    <!-- TAB 3: ALERTS -->
    <section id="tab-alerts" class="hidden fade">
      <div class="bg-white shadow-md rounded-2xl p-4">
        <h2 id="tLinkTitle" class="text-lg font-bold text-etblue"></h2>
        <p id="tLinkSub" class="text-xs text-slate-500 mb-3"></p>

        <input id="urlInput" data-ph="phUrl"

          <button id="tExScam" onclick="tryUrl('http://telebirr-bonus.xyz')" class="text-[11px] font-semibold bg-red-100 text-red-700 rounded-xl py-2"></button>
          <button id="tExTypo" onclick="tryUrl('teebirr.co/free-gift')" class="text-[11px] font-semibold bg-amber-100 text-amber-700 rounded-xl py-2"></button>
        </div>
        <button id="tCheckBtn" onclick="checkUrl()" class="w-full mt-3 bg-etblue hover:bg-etblue2 text-white font-bold py-3 rounded-xl shadow-sm active:scale-[0.99] transition"></button>
      </div>

      <div id="urlResult" class="mt-4"></div>

      <div class="mt-4 bg-white shadow-md rounded-2xl p-4">
        <h3 id="tFeedTitle" class="font-semibold text-etblue text-sm"></h3>

          <button id="tPost" onclick="addReport()" class="bg-etlime text-etblue font-bold px-4 rounded-xl text-sm"></button>
        </div>
        <div id="feed" class="mt-3 space-y-2"></div>
      </div>
    </section>

    <!-- TAB 4: SOS -->
    <section id="tab-sos" class="hidden fade">
      <div class="bg-white shadow-md rounded-2xl p-4">
        <h2 id="tSosTitle" class="text-lg font-bold text-etblue"></h2>
        <p id="tSosSub" class="text-xs text-slate-500 mb-3"></p>
        <div id="hotlines" class="space-y-3"></div>
      </div>

      <div class="mt-4 rounded-2xl border border-red-200 bg-red-50 p-4">
        <h3 id="tGuideTitle" class="font-bold text-red-700 text-sm"></h3>
        <ol id="guideList" class="mt-2 space-y-2 text-sm text-slate-700 list-decimal list-inside"></ol>
      </div>
    </section>

    <!-- TAB 5: ANALYTICS -->
    <section id="tab-stats" class="hidden fade">
      <div class="bg-white shadow-md rounded-2xl p-4">
        <h2 id="tStatsTitle" class="text-lg font-bold text-etblue"></h2>
        <p id="tStatsSub" class="text-xs text-slate-500 mb-3"></p>

        <div class="grid grid-cols-2 gap-3">
          <div class="rounded-2xl bg-etblue text-white p-4">
            <p class="text-3xl font-bold" id="mScans">0</p>

          </div>
          <div class="rounded-2xl bg-red-500 text-white p-4">
            <p class="text-3xl font-bold" id="mFraud">0</p>
            <p class="text-[11px] text-red-100" data-i="mFraud"></p>
          </div>

  </main>

      </span>

    <button class="tabbtn flex flex-col items-center justify-center gap-1" data-tab="ussd" onclick="switchTab('ussd')">
      <span class="ico w-10 h-8 grid place-items-center rounded-full">

    <button class="tabbtn flex flex-col items-center justify-center gap-1" data-tab="alerts" onclick="switchTab('alerts')">
      <span class="ico w-10 h-8 grid place-items-center rounded-full">
        <svg viewBox="0 0 24 24" class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3a6 6 0 016 6c0 4 1.5 5.5 2 6.2H4c.5-.7 2-2.2 2-6.2a6 6 0 016-6z"/><path d="M10 19.5a2 2 0 004 0"/></svg>
      </span>
      <span class="text-[10px] font-semibold" data-i="navAlerts"></span>
    </button>
    <button class="tabbtn flex flex-col items-center justify-center gap-1" data-tab="stats" onclick="switchTab('stats')">
      <span class="ico w-10 h-8 grid place-items-center rounded-full">
        <svg viewBox="0 0 24 24" class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M5 19V11M12 19V5M19 19v-6"/></svg>

      <span class="text-[10px] font-semibold" data-i="navStats"></span>

    <button class="tabbtn flex flex-col items-center justify-center gap-1" data-tab="sos" onclick="switchTab('sos')">
      <span class="ico w-10 h-8 grid place-items-center rounded-full">
        <svg viewBox="0 0 24 24" class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M6.5 3.5h3l1.5 4-2 1.5a12 12 0 006 6l1.5-2 4 1.5v3a2 2 0 01-2.2 2A16.5 16.5 0 014.5 5.7 2 2 0 016.5 3.5z"/></svg>
      </span>
      <span class="text-[10px] font-semibold" data-i="navSos"></span>
    </button>
  </nav>
</div>

<script>
/* ---------- Telegram ---------- */
(function initTelegram(){
  try {
    var tg = window.Telegram && window.Telegram.WebApp;
    if (tg) { tg.ready(); tg.expand(); }
    var u = tg && tg.initDataUnsafe && tg.initDataUnsafe.user;
    var name = u ? [u.first_name, u.last_name].filter(Boolean).join(" ") : "Guest User";
    document.getElementById("uName").textContent = name;
    document.getElementById("uInitial").textContent = (name[0] || "U").toUpperCase();
    if (u && u.photo_url) {
      var p = document.getElementById("uPhoto");
      p.src = u.photo_url;
      p.classList.remove("hidden");
      document.getElementById("uInitial").classList.add("hidden");
    }
  } catch (e) { /* safe fallback */ }
})();

function runScan(){
  var txt = (document.getElementById("smsInput").value || "").trim();
  var box = document.getElementById("smsResult");
  if (!txt) { box.innerHTML = warn(T("scanEmpty")); return; }

  var low = txt.toLowerCase();
  var risk = 0, bad = [], good = [];

  var txId = txt.match(/\b[A-Z]{2,4}\d{2,4}[A-Z0-9]{4,8}\b/);
  if (txId) { good.push("Valid transaction number found: " + txId[0]); }
  else { risk += 30; bad.push("No valid telebirr transaction number (e.g. DHP254JOT6)."); }

  if (/telebirr/i.test(txt)) good.push("Mentions telebirr."); else { risk += 10; bad.push("Does not mention telebirr."); }
  if (/ethio\s*telecom/i.test(txt)) good.push("Signed by Ethio telecom."); else { risk += 10; bad.push("Missing official Ethio telecom signature."); }
  if (/\bETB\s?[\d,]+(\.\d{2})?/i.test(txt)) good.push("Amount formatted correctly."); else { risk += 10; bad.push("No properly formatted ETB amount."); }
  if (/balance/i.test(txt)) good.push("Shows account balance line."); else risk += 5;
  if (/\d{2}\/\d{2}\/\d{4}/.test(txt)) good.push("Contains a transaction date."); else risk += 5;

  var scamWords = ["pin","password","otp","code to","won","win","winner","bonus","free","gift","prize","congratulation","claim","urgent","click","verify your account","lottery","reward"];
  scamWords.forEach(function(w){ if (low.indexOf(w) > -1) { risk += 12; bad.push('Scam wording detected: "' + w + '".'); } });

  var link = txt.match(/(https?:\/\/[^\s]+|www\.[^\s]+|[a-z0-9-]+\.(xyz|top|click|info|co|link|online|site)[^\s]*)/i);
  if (link) {
    var v = analyzeUrl(link[0]);
    if (v.danger) { risk += 40; bad.push("Dangerous link inside the message: " + link[0]); }
    else { risk += 10; bad.push("Contains a link — telebirr rarely sends links."); }
  }
  if (/09\d{8}|\+2519\d{8}/.test(txt) && /send|transfer|call/i.test(low)) { risk += 15; bad.push("Asks you to contact a personal phone number."); }

  risk = Math.max(0, Math.min(99, risk));
  var s = stats(); s.scans++; if (risk >= 50) s.fraud++; else s.safe++; save(s);
  haptic(risk >= 50 ? "error" : "success");

  box.innerHTML = verdict(risk, bad, good);
}

/* ---------- Tab 3: strict link checker ---------- */
var OFFICIAL = ["telebirr.et","ethiotelecom.et"];
var BAD_WORDS = ["bonus","free","gift","win","winner","prize","reward","claim","lottery","promo","login-telebirr","telebirr-login","verify","update-account","otp","pin","support-telebirr","recharge-free"];
var BAD_TLDS = ["xyz","top","click","online","site","info","co","icu","link","live","ru","tk","cf","ml","gq","work","shop"];

function analyzeUrl(raw){
  var input = (raw || "").trim();
  var reasons = [], risk = 0, danger = false;
  if (!input) return { risk:0, danger:false, reasons:["Nothing entered."], host:"", invalid:true };

  var work = input.replace(/^\s*https?:\/\//i, "").replace(/^www\./i, "");
  var host = work.split(/[\/?#]/)[0].toLowerCase();
  var path = work.slice(host.length).toLowerCase();
  var low = input.toLowerCase();

  if (!/^[a-z0-9.-]+\.[a-z]{2,}$/i.test(host)) {
    return { risk: 60, danger: true, host: host || input, invalid: true,
      reasons: ["This is not a valid web address. Never open links you cannot read clearly."] };
  }

  var isOfficial = OFFICIAL.some(function(d){ return host === d || host.endsWith("." + d); });

  if (/^http:\/\//i.test(input)) { risk += 20; reasons.push("Uses insecure http:// instead of https://."); }
  if (/^\d{1,3}(\.\d{1,3}){3}$/.test(host)) { risk += 60; reasons.push("Uses a raw IP address instead of a domain name."); }

  var tld = host.split(".").pop();
  var looksLikeBirr = /t[e3]+l[e3]?-?b[i1l]+r+|te+birr|tele-?birr|telbir|telebrr|ethi?o-?telecom|ethiotelcom/i.test(host);

  BAD_WORDS.forEach(function(w){
    if (low.indexOf(w) > -1) { risk += 35; danger = true; reasons.push('Suspicious keyword detected: "' + w + '".'); }
  });

  if (looksLikeBirr && !isOfficial) {
    risk += 60; danger = true;
    reasons.push("Fake domain mimicking Ethio Telecom / telebirr.");
    if (BAD_TLDS.indexOf(tld) > -1) reasons.push("Untrusted address ending .“" + tld + "” — the official one ends in .et.");
    if (host.indexOf("-") > -1) reasons.push("Extra hyphens used to imitate the real name.");
  } else if (!isOfficial && BAD_TLDS.indexOf(tld) > -1) {
    risk += 30; reasons.push("Address ends in .“" + tld + "”, commonly used by scam sites.");
  }

  if (host.split(".").length > 3 && !isOfficial) { risk += 20; reasons.push("Long chain of sub-domains used to hide the real owner."); }
  if (/(telebirr|ethiotelecom)/i.test(path) && !isOfficial) { risk += 35; danger = true; reasons.push("Brand name hidden in the page address, not the domain."); }
  if (/[а-яα-ω]/i.test(host)) { risk += 50; danger = true; reasons.push("Contains look-alike foreign letters."); }

  if (isOfficial) {
    if (risk >= 35) { danger = true; reasons.push("Official-looking domain but with unsafe content in the address."); }
    else { risk = Math.min(risk, 10); reasons = ["Matches the official Ethio Telecom domain list."].concat(reasons); }
  } else if (!danger && risk < 40) {
    risk = Math.max(risk, 45);
    reasons.push("Not on the official list of Ethio Telecom addresses.");
  }

  risk = Math.max(0, Math.min(99, risk));
  if (risk >= 60) danger = true;
  if (danger) risk = Math.max(risk, 86);
  return { risk: risk, danger: danger, reasons: reasons, host: host, official: isOfficial };
}

    var s1 = stats(); s1.scans++; ok ? s1.safe++ : s1.fraud++; save(s1);
    return ussdPrint(ok
      ? "RESULT\n\n" + v.toUpperCase() + "\nFormat is VALID.\nConfirm the amount in your\ntelebirr balance before you\nrelease any goods.\n\n0. Back"
      : "RESULT\n\n" + v.toUpperCase() + "\nINVALID format.\nThis is likely a FAKE payment\nmessage. Do not deliver.\n\n0. Back");
  }
  if (state === "code") {
    var okc = /^\d{6}$/.test(v);
    return ussdPrint(okc
      ? "CODE " + v + "\nFormat looks correct.\nNEVER share this code with\nanyone, including callers\nclaiming to be Ethio Telecom.\n\n0. Back"
      : "CODE " + v + "\nNot a 6-digit code.\nTreat the message as fake.\n\n0. Back");
  }
  if (state === "rep") {
    var a = reports();
    a.unshift({ t: "USSD report: scam number " + v, d: new Date().toLocaleString() });
    saveReports(a);
    return ussdPrint("Thank you.\n\nNumber " + v + " was reported\nto the community feed.\nReference: R" + Math.floor(Math.random()*90000+10000) + "\n\n0. Back");
  }
  return ussdPrint("Invalid option.\n\n0. Back");
}

/* ---------- shared UI ---------- */
function esc(s){ return String(s).replace(/[&<>"']/g, function(c){ return ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" })[c]; }); }
function warn(t){ return '<div class="rounded-xl bg-amber-50 border border-amber-300 p-3 text-sm text-amber-800">' + esc(t) + '</div>'; }
function list(items){ return items.length ? '<ul class="mt-2 space-y-1 text-sm">' + items.map(function(i){ return '<li>• ' + esc(i) + '</li>'; }).join("") + '</ul>' : ""; }

function banner(tone, title, host, risk, reasons, note){
  var map = { red:["bg-red-50","border-red-300","text-red-800","bg-red-500"],
              amber:["bg-amber-50","border-amber-300","text-amber-900","bg-amber-400"],
              green:["bg-lime-50","border-etlime","text-etblue","bg-etlime"] };
  var c = map[tone];
  return '<div class="rounded-2xl ' + c[0] + ' border ' + c[1] + ' p-4 shadow-sm ' + c[2] + '">'
    + '<p class="font-bold">' + title + '</p>'
    + (host ? '<p class="text-xs mt-1 break-all opacity-80">' + esc(host) + '</p>' : "")
    + '<div class="mt-3"><div class="flex justify-between text-xs font-semibold"><span>' + esc(T("riskScore")) + '</span><span>' + risk + '%</span></div>'
    + '<div class="h-2 bg-white/70 rounded-full mt-1 overflow-hidden"><div class="h-full ' + c[3] + '" style="width:' + risk + '%"></div></div></div>'
    + list(reasons)
    + (note ? '<p class="mt-3 text-xs font-semibold">' + esc(note) + '</p>' : "")
    + '</div>';
}

function verdict(risk, bad, good){
  if (risk >= 50) {
    return banner("red", T("bRedSms"), "", risk,
      bad.length ? bad : ["Multiple signs of a fake message."],
      T("noteRedSms"));
  }
  if (risk >= 25) {
    return banner("amber", T("bAmberSms"), "", risk,
      bad.concat(good.slice(0,2)), T("noteAmberSms"));
  }
  return banner("green", T("bGreenSms"), "", risk,
    good, T("noteGreenSms"));
}

/* ---------- boot ---------- */
(function boot(){
  try { var l = localStorage.getItem(LANG_KEY); if (l === "am") LANG = "am"; } catch(e){}
  applyLang();
  render();
  ussdPrint("Press \"Dial *127#\" to start the session.");

  /* splash transition */
  setTimeout(function(){
    var splash = document.getElementById("splash");
    if (splash) {
      splash.classList.add("opacity-0", "pointer-events-none");
      setTimeout(function(){ splash.classList.add("hidden"); }, 500);
    }
  }, 2800);
})();
</script>
